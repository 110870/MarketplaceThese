<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marktabdeckung DE–PMI</title>
<style>
  :root{
    --navy:#051C2C; --ink:#1A1A1A; --mute:#6B7280; --line:#D0D5DD;
    --us:#051C2C; --own:#DCE6FF; --comp:#C3CAD4;
    --w0:#051C2C; --w1:#2251FF; --w2:#00A9F4; --w3:#9ADCF7; --w4:#E6F5FC;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:var(--ink)}
  .slide{width:1600px;height:900px;padding:30px 44px 24px;position:relative;background:#fff;overflow:hidden}
  .tracker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--w1);font-weight:700}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:28px;line-height:1.2;margin:6px 0 4px;color:var(--navy);max-width:1500px}
  .sub{font-size:14px;color:var(--mute);margin-bottom:12px}
  .body{display:flex;gap:28px}
  .matrixWrap{position:relative;padding-left:30px}
  .yaxis{position:absolute;left:0;top:0;height:546px;width:22px;display:flex;align-items:center;justify-content:center}
  .yaxis span{transform:rotate(-90deg);white-space:nowrap;font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.04em}
  .xaxis{margin-left:302px;margin-top:6px;font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:100px 192px repeat(8,92px);grid-template-rows:repeat(9,58px) auto auto;column-gap:3px;row-gap:3px}
  .rg{grid-column:1;font-size:11px;font-weight:700;color:var(--navy);border-right:2px solid var(--navy);display:flex;align-items:center;padding-right:8px;line-height:1.25}
  .rh{grid-column:2;font-size:11.5px;line-height:1.25;display:flex;align-items:center;padding:0 8px}
  .ch{grid-row:10;font-size:11px;line-height:1.2;text-align:center;padding:6px 2px 4px;display:flex;align-items:flex-start;justify-content:center}
  .grp{grid-row:11;font-size:11px;font-weight:700;color:var(--navy);border-top:2px solid var(--navy);padding:4px 2px 0;text-align:center}
  .cell{border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;position:relative}
  .U{background:var(--us)}
  .P{background:var(--own);border:1.5px solid var(--w1)}
  .W{background:var(--comp)}
  .X{background:repeating-linear-gradient(45deg,#F2F4F7 0 6px,#C9CED6 6px 8px);color:var(--mute);font-size:10px;font-weight:700;text-align:center;line-height:1.1}
  .w0{background:var(--w0)} .w1{background:var(--w1)} .w2{background:var(--w2)}
  .w3{background:var(--w3);color:var(--navy)} .w4{background:var(--w4);color:var(--navy);border:1px solid #B9E3F5}
  .chk{position:absolute;top:3px;right:5px;font-size:11px;font-weight:700}
  .core{outline:3px solid #FFB000;outline-offset:2px;z-index:2}
  .note{position:absolute;font-size:11.5px;font-weight:700;color:var(--navy);background:#fff;padding:2px 6px;border-left:3px solid #FFB000;line-height:1.25}
  svg.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  .side{width:350px;padding-top:2px}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{border-top:3px solid var(--navy);padding-top:6px}
  .kpi .lbl{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;line-height:1.25;min-height:27px}
  .kpi .val{font-family:Georgia,serif;font-size:32px;color:var(--navy);line-height:1.05;margin-top:2px}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:12px;margin-bottom:14px}
  .legend div{display:flex;align-items:center;gap:9px}
  .sw{width:22px;height:15px;border-radius:2px;flex:none}
  .hd{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:2px solid var(--navy);padding-bottom:4px;margin-top:4px}
  .list{font-size:12px;line-height:1.3}
  .list .row{display:grid;grid-template-columns:24px 1fr 52px;gap:8px;align-items:start;padding:5px 0;border-bottom:1px solid var(--line)}
  .list .row.one{grid-template-columns:1fr}
  .badge{width:22px;height:22px;border-radius:2px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
  .list b{color:var(--navy)}
  .list .m{color:var(--mute)}
  .dots{font-size:11px;letter-spacing:1px;color:var(--navy);text-align:right;white-space:nowrap}
  .foot{position:absolute;left:44px;right:44px;bottom:16px;font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="slide">
  <div class="tracker" id="tracker"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="body">
    <div class="matrixWrap" id="mw">
      <div class="yaxis"><span>FLÜGE &nbsp;↑&nbsp; weitere Beschaffungswege & Fare-Optionen</span></div>
      <div class="grid" id="grid"></div>
      <div class="xaxis">HOTELS &nbsp;→&nbsp; weitere Beschaffungswege & Ratentypen &nbsp;·&nbsp; Marge ↓ &nbsp;Verfügbarkeit ↑</div>
    </div>
    <div class="side" id="side"></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
// ===== Datenmodell (Index 0 = Ursprung unten links) =====
// Flüge: von unten (eigenes Volumen) nach oben (weitere Beschaffungswege)
const flights = [
  "Pooling / Private Gate – inkl. Gepäck",
  "Pooling – ohne Gepäck (Light)",
  "Einzelplatz / Broker – inkl. Gepäck",
  "Linie (GDS) – Classic inkl. Gepäck",
  "Linie NDC – Light / Basic",
  "Linie NDC – Flex / erstattbar",
  "Low-Cost – Basic / Bundle",
  "Low-Cost – Flexi / umbuchbar",
  "Exklusive Flüge anderer Veranstalter",
];
const flightGroups = [ // von unten nach oben
  {name:"Eigene Volumenflüge", span:2},
  {name:"Zukauf Charter", span:1},
  {name:"Linie", span:3},
  {name:"Low-Cost", span:2},
  {name:"Kein Zugriff", span:1},
];
// Hotels: von links (eigene Kontrakte) nach rechts (weitere Beschaffungswege)
const hotels = [
  "Top Choice – Eigenkontrakt, Vorauszahlung & Garantie",
  "Non-refundable",
  "Flex / kostenlos stornierbar",
  "Non-refundable",
  "Flex / kostenlos stornierbar",
  "Member-, Mobile- & Opaque-Raten",
  "Ferienwohnung / Finca",
  "Exklusive Hotels anderer Veranstalter",
];
const hotelGroups = [
  {name:"Eigenkontrakt", span:1},
  {name:"Channel Manager", span:2},
  {name:"Bettenbank", span:2},
  {name:"Spezial / Alternativ", span:2},
  {name:"Kein Zugriff", span:1},
];
const NF = flights.length, NH = hotels.length;
const isX = (f,h) => f===NF-1 || h===NH-1;
const isOwn = (f,h) => h===0 || f<=1;              // basiert auf eigenem Inventar
const today = new Set(["0,0","2,0","3,0","0,1","0,3","2,3","3,3"]); // "f,h" heute im Verkauf

const statusOf = (f,h) => isX(f,h) ? "X" : today.has(f+","+h) ? "U" : isOwn(f,h) ? "P" : "W";

// Bewertung / Rollout-Wellen (vorläufig)
const waves = [
  {n:0, name:"Kern: Hauptinventar", logic:"Pooling (Private Gate) × Top Choice; Steuerung entlang der Hochlaufkurve, im Idealfall ausverkauft", prod:"", marge:5},
  {n:1, name:"Hotel als Werttreiber", logic:"Top Choice mit allen Flugquellen: Einzelplatz, Broker, Linie, NDC, Low-Cost", prod:"NDC- & Low-Cost-Anbindung, Light-Fares", marge:4},
  {n:2, name:"Flugvolumen sichern", logic:"Pooling mit stark nachgefragten Hotels aus Channel Manager & Bettenbank", prod:"CM-Anbindung ausbauen, Flex-Raten, Pooling Light", marge:3},
  {n:3, name:"Verfügbarkeit sichern", logic:"Weitere Flugquellen × CM/Bettenbank: immer Ware im Verkauf, auch wenn Eigeninventar ausverkauft", prod:"Dynamic Packaging über alle Quellen", marge:2},
  {n:4, name:"Opportunistisch", logic:"Spezialraten & Ferienwohnungen mit Fremdflügen", prod:"", marge:1},
];
const waveOf = (f,h) => {
  if(isX(f,h)) return null;
  if(f===0 && h===0) return 0;
  if(h===0) return 1;
  if(f<=1) return 2;
  if(h<=4) return 3;
  return 4;
};

// ===== Rendering =====
const view = new URLSearchParams(location.search).get("view")==="target" ? "target" : "status";
const all=[]; for(let f=0;f<NF;f++) for(let h=0;h<NH;h++) if(!isX(f,h)) all.push([f,h]);
const total = all.length;
const cnt = s => all.filter(([f,h])=>statusOf(f,h)===s).length;
const pct = n => Math.round(n/total*100);

document.getElementById("tracker").textContent = view==="status" ? "Gesamtmarkt & Status quo" : "Bewertung & Rollout-Logik (vorläufig)";
document.getElementById("title").textContent = view==="status"
  ? `Der Kunde wählt auf DE → PMI aus einem riesigen Angebotsraum – wir verkaufen heute ~${pct(cnt("U"))}% davon; weitere ~${pct(cnt("P"))}% basieren auf eigenem Inventar und können nur wir heben`
  : "Wir expandieren von unten links nach oben rechts: erst das Hotelinventar mit allen Flugquellen monetarisieren, dann das Flugvolumen mit dynamischen Hotels absichern";
document.getElementById("sub").textContent = view==="status"
  ? "Gesamtmarkt = jede Kombination aus Flugquelle/Fare-Option und Hotelquelle/Ratentyp; Ursprung unten links = unser Hauptinventar"
  : "Wellen nach Wertbeitrag: Marge sinkt, Verfügbarkeit steigt mit jedem weiteren Beschaffungsweg";
document.getElementById("foot").innerHTML = view==="status"
  ? "<span>Illustrativ – Zellen = Produktkombinationen, ungewichtet; Gewichtung nach Buchungsvolumen in Folgeschritt</span><span>TOM = heutiges Operating Model</span>"
  : "<span>Illustrativ – Wellenzuordnung und Bewertung zur Entscheidung; ✓ = heute bereits im Verkauf</span><span>TOM = heutiges Operating Model</span>";

const g=document.getElementById("grid");
const add=(cls,html,style={})=>{const d=document.createElement("div");d.className=cls;d.innerHTML=html||"";Object.assign(d.style,style);g.appendChild(d);return d;};
const rowOf = f => NF - f; // f=0 → unterste Zeile

// Zeilengruppen (von unten)
let f0=0; for(const gr of flightGroups){ const top=rowOf(f0+gr.span-1); add("rg",gr.name,{gridRow:`${top} / span ${gr.span}`}); f0+=gr.span; }
flights.forEach((n,f)=>add("rh",n,{gridRow:rowOf(f)}));
hotels.forEach((n,h)=>add("ch",n,{gridColumn:h+3}));
let h0=0; for(const gr of hotelGroups){ add("grp",gr.name,{gridColumn:`${h0+3} / span ${gr.span}`}); h0+=gr.span; }

const cellEl={};
for(let f=0;f<NF;f++) for(let h=0;h<NH;h++){
  const st=statusOf(f,h); let cls=st, txt="";
  if(st==="X") txt = (f===NF-1 && h===NH-1) ? "" : "kein<br>Zugriff";
  if(view==="target" && st!=="X"){ const w=waveOf(f,h); cls="w"+w; txt=String(w); if(st==="U") txt+=`<span class="chk">✓</span>`; }
  if(f===0 && h===0) cls+=" core";
  cellEl[f+","+h]=add("cell "+cls, txt, {gridRow:rowOf(f), gridColumn:h+3});
}

// Overlays
requestAnimationFrame(()=>{
  const mw=document.getElementById("mw"), mr=mw.getBoundingClientRect();
  const r=k=>{const b=cellEl[k].getBoundingClientRect();return {x:b.left-mr.left,y:b.top-mr.top,w:b.width,h:b.height,cx:b.left-mr.left+b.width/2,cy:b.top-mr.top+b.height/2};};
  const a=r("0,0"), b=r(`${NF-3},${NH-3}`), tl=r(`${NF-1},0`), br=r(`0,${NH-1}`);
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg"); svg.setAttribute("class","ov"); svg.setAttribute("width",mr.width); svg.setAttribute("height",mr.height);
  // Rahmen Gesamtmarkt
  const fr=document.createElementNS(svgNS,"rect");
  Object.entries({x:tl.x-6,y:tl.y-6,width:br.x+br.w-tl.x+12,height:br.y+br.h-tl.y+12,fill:"none",stroke:"#051C2C","stroke-width":3,rx:3}).forEach(([k,v])=>fr.setAttribute(k,v));
  svg.appendChild(fr);
  // Expansionspfeil
  svg.innerHTML += `<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFB000"/></marker></defs>`;
  const ln=document.createElementNS(svgNS,"line");
  Object.entries({x1:a.x+a.w+2,y1:a.y-2,x2:b.x+b.w+1,y2:b.y-1,stroke:"#FFB000","stroke-width":5,"stroke-dasharray":"12 7","marker-end":"url(#ah)",opacity:.95}).forEach(([k,v])=>ln.setAttribute(k,v));
  svg.appendChild(ln);
  mw.appendChild(svg);
  // Beschriftungen
  const lab=(html,x,y)=>{const d=document.createElement("div");d.className="note";d.innerHTML=html;d.style.left=x+"px";d.style.top=y+"px";mw.appendChild(d);return d;};
  lab("Hauptinventar ▸<br><span style='font-weight:400'>Pooling × Top Choice<br>höchste Marge</span>", a.x-160, a.y+a.h+12);
  const gm=document.createElement("div"); gm.className="note"; gm.style.borderLeft="none"; gm.textContent="GESAMTMARKT DE → PMI";
  gm.style.left=(br.x+br.w-170)+"px"; gm.style.top=(tl.y-24)+"px"; mw.appendChild(gm);
});

// Seitenleiste
const side=document.getElementById("side");
const sw=(bg,extra="")=>`<span class="sw" style="background:${bg};${extra}"></span>`;
const dots=n=>"●".repeat(n)+"<span style='color:#C9CED6'>"+"●".repeat(5-n)+"</span>";
if(view==="status"){
  side.innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="lbl">Heute im Verkauf</div><div class="val">${pct(cnt("U"))}%</div></div>
      <div class="kpi"><div class="lbl">Eigenpotenzial (nur wir)</div><div class="val" style="color:var(--w1)">${pct(cnt("P"))}%</div></div>
      <div class="kpi"><div class="lbl">Nur Wettbewerb</div><div class="val" style="color:#8A94A3">${pct(cnt("W"))}%</div></div>
    </div>
    <div class="legend">
      <div>${sw("var(--us)")} Heute von uns im Verkauf</div>
      <div>${sw("var(--own)","border:1.5px solid var(--w1)")} Eigenpotenzial: basiert auf unserem Inventar, heute nicht verkauft</div>
      <div>${sw("var(--comp)")} Nur durch Wettbewerb adressiert</div>
      <div>${sw("repeating-linear-gradient(45deg,#F2F4F7 0 4px,#C9CED6 4px 6px)")} Kein Zugriff: Exklusivware anderer Veranstalter</div>
    </div>
    <div class="hd">Warum? – TOM-Restriktionen</div>
    <div class="list">
      <div class="row one"><span><b>Pooling nur mit Gepäck:</b> kein Light-Produkt auf Private Gate</span></div>
      <div class="row one"><span><b>Top Choice nur mit eigenen Flügen</b> und wenigen Zukaufquellen kombinierbar</span></div>
      <div class="row one"><span><b>Kein NDC- / Low-Cost-Handling:</b> Airline-Bundles & Flex-Fares nicht abbildbar</span></div>
      <div class="row one"><span><b>Starre Storno-Logik:</b> keine Flex-Hotelraten im Paket</span></div>
    </div>`;
}else{
  const wc=["var(--w0)","var(--w1)","var(--w2)","var(--w3)","var(--w4)"];
  const rows=waves.map(w=>`<div class="row"><span class="badge" style="background:${wc[w.n]};${w.n>=3?'color:var(--navy);':''}${w.n===4?'border:1px solid #B9E3F5':''}">${w.n}</span>
    <span><b>${w.name}</b><br><span class="m">${w.logic}</span>${w.prod?`<br><span style="color:var(--w1)">▸ ${w.prod}</span>`:""}</span>
    <span class="dots">${dots(w.marge)}</span></div>`).join("");
  side.innerHTML=`
    <div class="hd" style="display:flex;justify-content:space-between"><span>Rollout-Wellen</span><span>Marge</span></div>
    <div class="list">${rows}
      <div class="row"><span class="badge" style="background:repeating-linear-gradient(45deg,#F2F4F7 0 4px,#C9CED6 4px 6px)"></span><span><b>Kein Zugriff</b><br><span class="m">Exklusive Flüge & Hotels anderer Veranstalter – nicht adressierbar</span></span><span></span></div>
    </div>
    <div style="font-size:11.5px;color:var(--mute);margin-top:10px;line-height:1.35"><b style="color:var(--navy)">Steuerungslogik:</b> Eigeninventar folgt der Hochlaufkurve und ist im Idealfall ausverkauft – Channel Manager & Bettenbanken stellen sicher, dass dann immer noch Ware im Verkauf ist.</div>`;
}
</script>
</body>
</html>
